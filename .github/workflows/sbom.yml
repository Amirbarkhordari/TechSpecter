name: SBOM

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate-sbom:
    name: Generate SBOM artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and SBOM tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sbom]"
          pip install pip-licenses

      - name: Generate CycloneDX and SPDX SBOMs
        run: python tools/generate_sbom.py --output-dir dist/sbom

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/
          if-no-files-found: error
