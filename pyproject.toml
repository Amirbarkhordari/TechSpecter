[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "techspecter"
dynamic = ["version"]
description = "Passive web application analysis framework for technology fingerprinting, HTTP observation, metadata intelligence, and structured reporting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "TechSpecter Contributors" },
]
maintainers = [
    { name = "TechSpecter Contributors" },
]
keywords = [
    "security",
    "fingerprinting",
    "javascript",
    "web-technology",
    "reconnaissance",
    "passive-analysis",
    "web-intelligence",
    "osint",
    "metadata",
    "openapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "orjson>=3.10.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "types-PyYAML>=6.0.0",
    "build>=1.2.0",
]
release = [
    "build>=1.2.0",
    "twine>=5.0.0",
]
sbom = [
    "cyclonedx-python-lib>=7.0.0",
]

[project.scripts]
techspecter = "techspecter.cli:main"

[project.entry-points."techspecter.plugins"]
# Register third-party plugins here, for example:
# example = "example_plugin:create_plugin"

[project.urls]
Homepage = "https://github.com/Amirbarkhordari/TechSpecter"
Documentation = "https://github.com/Amirbarkhordari/TechSpecter/tree/main/docs"
Repository = "https://github.com/Amirbarkhordari/TechSpecter"
Issues = "https://github.com/Amirbarkhordari/TechSpecter/issues"
Changelog = "https://github.com/Amirbarkhordari/TechSpecter/blob/main/CHANGELOG.md"
Security = "https://github.com/Amirbarkhordari/TechSpecter/blob/main/SECURITY.md"
Support = "https://github.com/Amirbarkhordari/TechSpecter/blob/main/SUPPORT.md"

[tool.hatch.version]
path = "techspecter/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["techspecter"]

[tool.hatch.build.targets.sdist]
include = [
  "techspecter/",
  "tests/",
  "docs/",
  "examples/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "SUPPORT.md",
  "ROADMAP.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
