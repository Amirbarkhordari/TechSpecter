[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "techspecter"
version = "0.4.0"
description = "Professional cross-platform Web Technology Fingerprinting and JavaScript Intelligence framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "TechSpecter Contributors" },
]
keywords = [
    "security",
    "fingerprinting",
    "javascript",
    "web-technology",
    "reconnaissance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
techspecter = "techspecter.cli:main"

[project.urls]
Homepage = "https://github.com/Amirbarkhordari/TechSpecter"
Documentation = "https://github.com/Amirbarkhordari/TechSpecter#readme"
Repository = "https://github.com/Amirbarkhordari/TechSpecter"
Issues = "https://github.com/Amirbarkhordari/TechSpecter/issues"
Changelog = "https://github.com/Amirbarkhordari/TechSpecter/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["techspecter"]

[tool.hatch.build.targets.sdist]
include = [
  "techspecter/",
  "tests/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
